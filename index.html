button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(80px);opacity:.35;animation:float 22s ease-in-out infinite alternate}
.blob.b1{background:#8b5cf6;top:-20vmax;right:-15vmax}
.blob.b2{background:#ec4899;bottom:-25vmax;left:-15vmax;animation-delay:-7s}
.blob.b3{background:#22d3ee;top:30%;left:30%;width:35vmax;height:35vmax;opacity:.2;animation-delay:-13s}
:root[data-theme="light"] .blob{opacity:.22}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.15)}100%{transform:translate(-4vmax,7vmax) scale(.95)}}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
header.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
header.bar .title{flex:1;font-weight:900;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;background:var(--card);border:1px solid var(--line);transition:transform .15s,background .2s}
.iconbtn:active{transform:scale(.9)}
main#view{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:16px 14px 90px}
.view-enter{animation:viewIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
h1,h2,h3{margin:.2em 0 .5em;font-weight:900}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--card2);border:1px solid var(--line);transition:transform .15s,filter .2s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);color:#fff;border:0;box-shadow:0 8px 24px rgba(236,72,153,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:8px 12px;font-size:.92rem;border-radius:11px}
.btn.danger{background:rgba(239,68,68,.15);color:#f87171;border-color:rgba(239,68,68,.35)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
/* בית */
.hero{text-align:center;padding:18px 0 8px}
.logo{display:inline-flex;gap:6px;direction:rtl}
.logo span{display:inline-grid;place-items:center;width:clamp(42px,11vw,64px);height:clamp(42px,11vw,64px);border-radius:14px;font-weight:900;font-size:clamp(1.6rem,6vw,2.4rem);color:#fff;background:var(--grad);box-shadow:0 8px 20px rgba(139,92,246,.4);animation:logoPop .7s cubic-bezier(.3,1.6,.5,1) both}
.logo span:nth-child(odd){background:linear-gradient(135deg,#22d3ee,#8b5cf6)}
.logo span.plus{background:linear-gradient(135deg,#fbbf24,#f97316)}
@keyframes logoPop{from{transform:translateY(-40px) rotate(-20deg) scale(.3);opacity:0}}
.tagline{margin-top:10px;color:var(--muted)}
.rankcard{display:flex;align-items:center;gap:14px;margin:16px 0}
.rankbadge{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:conic-gradient(var(--gold) var(--p,0%),rgba(255,255,255,.08) 0);position:relative;flex-shrink:0}
.rankbadge::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg2)}
.rankbadge b{position:relative;z-index:1}
.progress{height:10px;border-radius:99px;background:rgba(127,127,127,.2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.streak{font-weight:800;color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;overflow:hidden;border-radius:20px;padding:18px 14px;min-height:118px;text-align:right;color:#fff;font-weight:800;font-size:1.08rem;box-shadow:var(--shadow);transition:transform .2s;display:flex;flex-direction:column;justify-content:space-between}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:2rem}
.tile small{font-weight:500;opacity:.85;font-size:.82rem}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(100%);transition:transform .7s}
.tile:hover::after{transform:translateX(-100%)}
.t1{background:linear-gradient(135deg,#8b5cf6,#6366f1)}.t2{background:linear-gradient(135deg,#ec4899,#f43f5e)}.t3{background:linear-gradient(135deg,#06b6d4,#3b82f6)}.t4{background:linear-gradient(135deg,#f59e0b,#ef4444)}.t5{background:linear-gradient(135deg,#10b981,#059669)}.t6{background:linear-gradient(135deg,#a855f7,#ec4899)}.t7{background:linear-gradient(135deg,#64748b,#334155)}.t8{background:linear-gradient(135deg,#eab308,#f97316)}
/* טפסים */
label.f{display:block;font-weight:700;margin:14px 0 6px}
input.in,textarea.in,select.in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);outline:none;transition:border .2s,box-shadow .2s}
input.in:focus,textarea.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
textarea.in{min-height:150px;resize:vertical;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:4px 10px;border-radius:99px;font-size:.88rem;background:var(--card2);border:1px solid var(--line);animation:chipIn .25s}
.chip.bad{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#f87171}
.chip.dup{opacity:.5;text-decoration:line-through}
@keyframes chipIn{from{transform:scale(.6);opacity:0}}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;font-weight:700;transition:background .2s,color .2s}
.seg button.on{background:var(--grad);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{position:relative;width:52px;height:30px;border-radius:99px;background:rgba(127,127,127,.35);transition:background .25s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(-22px)}
.dirs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.dirs .btn.on{background:var(--grad);color:#fff;border:0}
/* תפזורת */
.play{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.play{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.statbar{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.92rem}
.gridwrap{position:relative;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.grid{display:grid;direction:rtl;background:var(--cell);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.cell{display:grid;place-items:center;font-weight:700;color:var(--cellText);transition:color .2s,transform .2s}
.grid.drop .cell{animation:drop .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-60px) scale(.3);opacity:0}}
.cell.anchor{color:#fff;background:var(--accent);border-radius:30%}
.cell.hint{animation:hintPulse .7s ease-in-out 5}
@keyframes hintPulse{50%{background:var(--gold);color:#000;border-radius:50%;transform:scale(1.25)}}
.cell.secret{color:#000;background:var(--gold);border-radius:25%;animation:secretPop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes secretPop{from{transform:scale(0) rotate(-90deg)}}
svg.overlay{position:absolute;inset:0;pointer-events:none;overflow:visible}
svg.overlay line{stroke-linecap:round}
svg.overlay line.found{animation:capsIn .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes capsIn{from{stroke-width:2;opacity:0}}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.word{padding:6px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;transition:all .35s}
.word.found{text-decoration:line-through;text-decoration-thickness:2px;color:#fff;border-color:transparent;transform:scale(.95)}
.word.found.pop{animation:wordPop .5s}
@keyframes wordPop{40%{transform:scale(1.25)}}
.word.blank{letter-spacing:3px;color:var(--muted)}
.banner{padding:12px 16px;border-radius:14px;background:var(--grad);color:#fff;font-weight:800;text-align:center;margin-bottom:12px}
.secretbox{text-align:center;font-size:1.4rem;font-weight:900;letter-spacing:1px;margin-top:10px}
/* רשימות */
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:transform .15s}
.item:active{transform:scale(.99)}
.item .ic{font-size:1.7rem}
.item .meta{flex:1;min-width:0}
.item .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta small{color:var(--muted)}
.badges{display:flex;gap:4px}
.badge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:800;background:rgba(127,127,127,.18);color:var(--muted)}
.badge.on.easy{background:#22c55e;color:#fff}.badge.on.medium{background:#f59e0b;color:#fff}.badge.on.hard{background:#ef4444;color:#fff}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.cat{border-radius:18px;padding:16px;background:var(--card);border:1px solid var(--line);text-align:right;display:flex;flex-direction:column;gap:6px;transition:transform .2s,border .2s;position:relative;overflow:hidden}
.cat:hover{transform:translateY(-3px);border-color:var(--accent)}
.cat .ic{font-size:2rem}
.cat b{font-size:1rem}
.cat .progress{height:6px}
.cat.done::before{content:"✓";position:absolute;top:10px;left:12px;color:var(--ok);font-weight:900;font-size:1.2rem}
/* הישגים */
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center;opacity:.45;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:var(--gold);box-shadow:0 0 18px rgba(251,191,36,.25)}
.ach .ic{font-size:2rem}
.ach b{display:block;margin:6px 0 2px}
.ach small{color:var(--muted);font-size:.8rem}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-size:1.5rem;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat small{color:var(--muted)}
.ranks{display:grid;gap:6px;margin-top:10px}
.rk{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--card)}
.rk.cur{background:var(--grad);color:#fff;font-weight:800}
.rk.locked{opacity:.5}
/* מודאל */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,3,20,.6);backdrop-filter:blur(6px)}
#modal.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:mIn .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes mIn{from{transform:scale(.85) translateY(20px);opacity:0}}
.mbox h2{margin-top:0}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);z-index:60;padding:12px 20px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:700;transition:transform .35s cubic-bezier(.3,1.4,.5,1);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none}
.bigwin{text-align:center}
.bigwin .trophy{font-size:4.5rem;animation:trophy 1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes trophy{from{transform:scale(0) rotate(-180deg)}}
.pts{font-size:2.4rem;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.achpop{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);margin-top:8px;text-align:right;animation:chipIn .4s both}
.bkitem{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.bkitem b{flex:1}
.pick{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
.pick.on{border-color:var(--accent);background:rgba(139,92,246,.12)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .ic{font-size:3rem}
.rankup{text-align:center}
.rankup .big{font-size:5rem;animation:trophy 1s cubic-bezier(.3,1.6,.5,1) both}
.rankup h2{font-size:1.8rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.sec-h h2{margin:0;font-size:1.25rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.pill.on{background:var(--grad);color:#fff}
.play>div{min-width:0}#zw{max-width:100%}
</style></head>

<main id="view"></main></div>

<script>/* ===== מנוע התפזורות ===== */
const HEB_LETTERS = 'אבגדהוזחטיכלמנסעפצקרשת';
const FINAL_MAP = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
// שכיחות אותיות בעברית (מקורב) לאותיות מילוי טבעיות
const LETTER_FREQ = { 'א':6.3,'ב':4.7,'ג':1.3,'ד':2.6,'ה':8.7,'ו':10.5,'ז':0.9,'ח':2.2,'ט':1.3,'י':11.1,'כ':2.7,'ל':7.4,'מ':6.5,'נ':4.4,'ס':1.5,'ע':3.1,'פ':1.8,'צ':1.3,'ק':1.9,'ר':5.6,'ש':4.4,'ת':5.3 };
const FREQ_TABLE = (() => { const t = []; let acc = 0; for (const [k, v] of Object.entries(LETTER_FREQ)) { acc += v; t.push([acc, k]); } return { t, total: acc }; })();

const DIRS = {
  h: [[0, 1]],             // אופקי בכיוון הקריאה
  v: [[1, 0]],             // אנכי למטה
  d: [[1, 1], [1, -1]],    // אלכסון למטה
  rh: [[0, -1]],           // אופקי הפוך
  rv: [[-1, 0]],           // אנכי הפוך
  rd: [[-1, -1], [-1, 1]]  // אלכסון הפוך
};
const LEVELS = {
  easy:   { name: 'קל',     dirs: { h: 1, v: 1, d: 0, rev: 0 }, fill: 2.0, min: 8,  mult: 5 },
  medium: { name: 'בינוני', dirs: { h: 1, v: 1, d: 1, rev: 0 }, fill: 1.75, min: 10, mult: 8 },
  hard:   { name: 'קשה',    dirs: { h: 1, v: 1, d: 1, rev: 1 }, fill: 1.55, min: 11, mult: 12 }
};

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function newSeed() { return (Math.random() * 2 ** 31) | 0; }

function stripNikud(s) { return s.replace(/[֑-ׇ]/g, ''); }
function normWord(s) { return stripNikud(s).replace(/[^א-ת]/g, '').replace(/[ךםןףץ]/g, c => FINAL_MAP[c]); }

/* ניתוח קלט המשתמש: מילה בכל שורה או מופרדות בפסיקים */
function parseWordInput(text) {
  const parts = stripNikud(text).split(/[\n,،;]+/).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const out = [], seen = new Set();
  for (const p of parts) {
    const item = { display: p, norm: normWord(p), ok: true, err: '' };
    if (/[A-Za-z0-9]/.test(p)) { item.ok = false; item.err = 'יש אנגלית או מספרים'; }
    else if (/[^א-ת \-'"׳״]/.test(p)) { item.ok = false; item.err = 'יש תו לא מוכר'; }
    else if (item.norm.length < 2) { item.ok = false; item.err = 'קצרה מדי'; }
    else if (seen.has(item.norm)) { item.dup = true; }
    if (item.ok && !item.dup) seen.add(item.norm);
    out.push(item);
  }
  return out;
}

function dirsFromOpts(o) {
  const list = [];
  if (o.h) list.push(...DIRS.h); if (o.v) list.push(...DIRS.v); if (o.d) list.push(...DIRS.d);
  if (o.rev) { if (o.h) list.push(...DIRS.rh); if (o.v) list.push(...DIRS.rv); if (o.d) list.push(...DIRS.rd); }
  return list.length ? list : [...DIRS.h, ...DIRS.v];
}

/*
 * יצירת תפזורת
 * words: [{display, norm}]  opts: {dirs:{h,v,d,rev}, level, hidden, seed}
 * מחזיר {n, grid:[[..]], placed:[{w, cells:[[r,c]..]}], hiddenCells, seed}
 */
function generatePuzzle(words, opts) {
  const seed = opts.seed ?? newSeed();
  const rnd = mulberry32(seed);
  const lv = LEVELS[opts.level || 'medium'];
  const dirs = dirsFromOpts(opts.dirs || lv.dirs);
  const hidden = normWord(opts.hidden || '');
  const ws = words.map((w, i) => ({ ...w, i })).filter(w => w.norm.length >= 2).sort((a, b) => b.norm.length - a.norm.length);
  const totalLetters = ws.reduce((s, w) => s + w.norm.length, 0);
  const longest = ws.length ? ws[0].norm.length : 3;
  let n = Math.max(lv.min, longest, Math.ceil(Math.sqrt(totalLetters * Math.max(1.3, lv.fill - Math.max(0, totalLetters - 150) / 450) + hidden.length * 1.1)));
  const hardBias = opts.level === 'hard';
  for (; n <= 60; n++) {
    for (let attempt = 0; attempt < (totalLetters > 250 ? 40 : 25); attempt++) {
      const res = tryPlace(ws, n, dirs, rnd, hardBias);
      if (!res) continue;
      const empties = []; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!res.grid[r][c]) empties.push([r, c]);
      if (empties.length < hidden.length) break; // צריך רשת גדולה יותר
      const hiddenCells = empties.slice(0, hidden.length);
      hiddenCells.forEach(([r, c], k) => res.grid[r][c] = hidden[k]);
      for (const [r, c] of empties.slice(hidden.length)) res.grid[r][c] = randLetter(rnd);
      res.placed.sort((a, b) => a.i - b.i);
      return { n, grid: res.grid, placed: res.placed.map(p => ({ i: p.i, cells: p.cells })), hiddenCells, seed };
    }
  }
  throw new Error('לא הצלחתי לבנות תפזורת');
}

function randLetter(rnd) { const x = rnd() * FREQ_TABLE.total; for (const [acc, k] of FREQ_TABLE.t) if (x < acc) return k; return 'י'; }

function tryPlace(ws, n, dirs, rnd, hardBias) {
  const grid = Array.from({ length: n }, () => Array(n).fill(''));
  const placed = [];
  for (const w of ws) {
    const s = w.norm, L = s.length, cands = [];
    for (const [dr, dc] of dirs) {
      const rMin = dr < 0 ? L - 1 : 0, rMax = dr > 0 ? n - L : n - 1;
      const cMin = dc < 0 ? L - 1 : 0, cMax = dc > 0 ? n - L : n - 1;
      for (let r = rMin; r <= rMax; r++) for (let c = cMin; c <= cMax; c++) {
        let ov = 0, ok = true;
        for (let k = 0; k < L; k++) { const ch = grid[r + dr * k][c + dc * k]; if (ch) { if (ch !== s[k]) { ok = false; break; } ov++; } }
        if (!ok || ov === L) continue;
        let score = ov * 2 + rnd() * 3;
        if (hardBias && (dr < 0 || dc < 0 || (dr && dc))) score += 1.5;
        cands.push([score, r, c, dr, dc]);
      }
    }
    if (!cands.length) return null;
    cands.sort((a, b) => b[0] - a[0]);
    const pick = cands[Math.floor(rnd() * Math.min(cands.length, 6))];
    const [, r, c, dr, dc] = pick, cells = [];
    for (let k = 0; k < L; k++) { grid[r + dr * k][c + dc * k] = s[k]; cells.push([r + dr * k, c + dc * k]); }
    placed.push({ i: w.i, cells });
  }
  return { grid, placed };
}

/* קידוד תפזורת לקישור שיתוף */
function b64urlEncode(str) { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64urlDecode(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); const bytes = Uint8Array.from(bin, c => c.charCodeAt(0)); return new TextDecoder().decode(bytes); }
function gridToCode(grid) { return grid.map(row => row.map(ch => String.fromCharCode(97 + HEB_LETTERS.indexOf(ch))).join('')).join(''); }
function codeToGrid(code, n) { const g = []; for (let r = 0; r < n; r++) { g.push([]); for (let c = 0; c < n; c++) g[r].push(HEB_LETTERS[code.charCodeAt(r * n + c) - 97]); } return g; }
function encodePuzzle(p) {
  const o = { v: 1, t: p.title, w: p.words.map(w => w.display), n: p.gen.n, g: gridToCode(p.gen.grid), l: p.level, x: p.hideList ? 1 : 0, h: p.hidden || '', p: p.gen.placed.map(pl => [pl.i, pl.cells[0][0], pl.cells[0][1], pl.cells[1][0] - pl.cells[0][0], pl.cells[1][1] - pl.cells[0][1]]) };
  return b64urlEncode(JSON.stringify(o));
}
function decodePuzzle(code) {
  const o = JSON.parse(b64urlDecode(code));
  const words = o.w.map(d => ({ display: d, norm: normWord(d) }));
  const grid = codeToGrid(o.g, o.n);
  const placed = o.p.map(([i, r, c, dr, dc]) => ({ i, cells: Array.from({ length: words[i].norm.length }, (_, k) => [r + dr * k, c + dc * k]) }));
  const hidden = normWord(o.h || '');
  const used = new Set(placed.flatMap(p => p.cells.map(([r, c]) => r * o.n + c)));
  const hiddenCells = [];
  for (let r = 0; r < o.n && hiddenCells.length < hidden.length; r++) for (let c = 0; c < o.n && hiddenCells.length < hidden.length; c++) if (!used.has(r * o.n + c)) hiddenCells.push([r, c]);
  return { title: o.t, words, level: o.l, hideList: !!o.x, hidden: o.h || '', gen: { n: o.n, grid, placed, hiddenCells, seed: 0 } };
}

if (typeof module !== 'undefined') module.exports = { generatePuzzle, parseWordInput, normWord, encodePuzzle, decodePuzzle, LEVELS };

/* ===== צלילים ואפקטים ===== */
const Sound = (() => {
  let ctx = null;
  const ac = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ctx && ctx.state === 'suspended') ctx.resume(); return ctx; };
  function tone(freq, dur = .12, type = 'sine', vol = .18, when = 0, slide = 0) {

const FX = (() => {
  let cv, cx, parts = [], raf = 0;
  const COLORS = ['#8b5cf6', '#ec4899', '#22d3ee', '#fbbf24', '#22c55e', '#f97316', '#ffffff'];
  function init() { cv = document.getElementById('fx'); cx = cv.getContext('2d'); resize(); addEventListener('resize', resize); }
  function resize() { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  function loop() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.life -= p.decay; p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, p.life)); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
      if (p.shape === 'rect') cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      else if (p.shape === 'star') { star(p.s); } else { cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, 7); cx.fill(); }
      cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : 0;
  }
  function star(s) { cx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? s / 4 : s / 2, a = i * Math.PI / 5; cx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } cx.fill(); }
  function go() { if (!raf) raf = requestAnimationFrame(loop); }
  const on = () => S.settings.fx !== false;
  function burst(x, y, n = 26, colors = COLORS, speed = 6) {
    if (!on()) return;
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = speed * (.4 + Math.random()); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .12, drag: .97, life: 1, decay: .018 + Math.random() * .015, s: 4 + Math.random() * 6, c: colors[i % colors.length], rot: 0, vr: .2, shape: Math.random() < .3 ? 'star' : 'dot' }); }
    go();
  }
  function confetti(n = 180) {
    if (!on()) return;
    for (let i = 0; i < n; i++) parts.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, g: .05, drag: .995, life: 1.6, decay: .004 + Math.random() * .004, s: 8 + Math.random() * 8, c: COLORS[i % COLORS.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .3, shape: 'rect' });
    go();
  }
  function fireworks(count = 6) {
    if (!on()) return;
    for (let k = 0; k < count; k++) setTimeout(() => {
      const x = innerWidth * (.15 + Math.random() * .7), y = innerHeight * (.15 + Math.random() * .4);
      const c = COLORS[k % COLORS.length]; burst(x, y, 50, [c, '#fff', COLORS[(k + 2) % COLORS.length]], 8);
    }, k * 280);
  }
  return { init, burst, confetti, fireworks };
})();

/* ===== הפקת PDF להדפסה (שחור-לבן) ===== */
const PDF = (() => {
  const PX = 8; // פיקסלים למ"מ (~200dpi)
  const FONT = 'Heebo, Arial, sans-serif';
  const LV_NAME = { easy: 'קל', medium: 'בינוני', hard: 'קשה' };

  function page(w, h) { const c = document.createElement('canvas'); c.width = w * PX; c.height = h * PX; const x = c.getContext('2d'); x.scale(PX, PX); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.direction = 'rtl'; x.fillStyle = '#000'; x.strokeStyle = '#000'; x.textBaseline = 'middle'; return { c, x, w, h, orient: w > h ? 'l' : 'p' }; }
  function font(x, size, weight = 400) { x.font = `${weight} ${size}px ${FONT}`; }
  function rr(x, X, Y, W, H, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); }
  function fitText(x, text, maxW, size, weight) { let s = size; font(x, s, weight); while (x.measureText(text).width > maxW && s > 2) { s -= .25; font(x, s, weight); } return s; }

  function header(pg, p, sub) {
    const { x, w } = pg; x.textAlign = 'center';
    fitText(x, p.title || 'תפזורת', w - 30, 9, 900); x.fillText(p.title || 'תפזורת', w / 2, 20);
    font(x, 3.6, 400); x.fillStyle = '#555'; x.fillText(sub, w / 2, 28); x.fillStyle = '#000';
    x.lineWidth = .4; x.beginPath(); x.moveTo(w / 2 - 30, 32); x.lineTo(w / 2 + 30, 32); x.stroke();
  }
  function footer(pg, num) { const { x, w, h } = pg; x.textAlign = 'center'; font(x, 3, 400); x.fillStyle = '#888'; x.fillText(num ? `— ${num} —` : 'תפזורת+', w / 2, h - 8); x.fillStyle = '#000'; }

  // ציור רשת (או חלק משורותיה)
  function drawGrid(pg, grid, n, X, Y, size, r0 = 0, r1 = n) {
    const { x } = pg, cs = size / n, rows = r1 - r0;
    x.lineWidth = .6; rr(x, X - 1.5, Y - 1.5, size + 3, cs * rows + 3, 3); x.stroke();
    x.textAlign = 'center'; font(x, cs * .62, 700);
    for (let r = r0; r < r1; r++) for (let c = 0; c < n; c++) {
      const cx = X + size - (c + .5) * cs, cy = Y + (r - r0 + .53) * cs; // ימין לשמאל
      x.fillText(grid[r][c], cx, cy);
    }
    if (n > 14) { // קווי עזר עדינים כל 5
      x.strokeStyle = '#ccc'; x.lineWidth = .15;
      for (let k = 5; k < n; k += 5) { const lx = X + size - k * cs; x.beginPath(); x.moveTo(lx, Y); x.lineTo(lx, Y + cs * rows); x.stroke(); }
      for (let k = Math.ceil(r0 / 5) * 5; k < r1; k += 5) { if (k === r0) continue; const ly = Y + (k - r0) * cs; x.beginPath(); x.moveTo(X, ly); x.lineTo(X + size, ly); x.stroke(); }
      x.strokeStyle = '#000';
    }
    return cs * rows;
  }

  // רשימת מילים: מחזיר פריסה שנכנסת בגובה הנתון
  function wordListLayout(p, width, maxH = 999) {
    if (p.hideList) { const cols = 3, rows = Math.ceil(p.words.length / cols); const rowH = Math.min(7.5, (maxH - 16) / rows); return { h: 16 + rows * rowH, cols, rowH, words: null }; }
    const words = p.words.map(w => w.display).sort((a, b) => a.localeCompare(b, 'he'));
    const longest = Math.max(...words.map(w => w.length));
    let cols = Math.max(1, Math.min(6, Math.floor(width / (longest * 2.1 + 10))));
    while (cols < 6 && 12 + Math.ceil(words.length / cols) * 6.6 > maxH) cols++;
    const rows = Math.ceil(words.length / cols), rowH = Math.min(6.6, (maxH - 12) / rows);
    return { h: 12 + rows * rowH, cols, rowH, words };
  }
  function drawWordList(pg, p, X, Y, W, L) {
    const { x } = pg; x.lineWidth = .35; rr(x, X, Y, W, L.h, 3); x.stroke();
    x.textAlign = 'right'; font(x, 4, 800);
    x.fillText(p.hideList ? `בתפזורת מסתתרות ${p.words.length} מילים — מצאו וכתבו אותן:` : 'אוצר המילים', X + W - 5, Y + 6);
    const colW = (W - 8) / L.cols, fs = Math.min(3.9, L.rowH * .62);
    if (!L.words) {
      x.lineWidth = .25; x.strokeStyle = '#999';
      for (let i = 0; i < p.words.length; i++) { const col = i % 3, row = Math.floor(i / 3), cx = X + W - 4 - col * (W - 8) / 3, cy = Y + 16 + row * L.rowH; font(x, Math.min(3, fs), 400); x.fillText(`${i + 1}.`, cx, cy); x.beginPath(); x.moveTo(cx - 6, cy + 1.5); x.lineTo(cx - (W - 8) / 3 + 3, cy + 1.5); x.stroke(); }
      x.strokeStyle = '#000'; return;
    }
    const perCol = Math.ceil(L.words.length / L.cols), box = Math.min(3.2, L.rowH * .55);
    L.words.forEach((w, i) => {
      const col = Math.floor(i / perCol), row = i % perCol;
      const rx = X + W - 4 - col * colW, cy = Y + 9.5 + (row + .5) * L.rowH;
      x.lineWidth = .3; x.strokeRect(rx - box, cy - box / 2, box, box);
      fitText(x, w, colW - box - 3.5, fs, 400); x.fillText(w, rx - box - 1.8, cy + .2);
    });
  }
  function hiddenLine(pg, p, X, Y, W) {
    const { x } = pg; const groups = (p.hidden || '').trim().split(/\s+/).map(g => normWord(g).length).filter(Boolean);
    const total = groups.reduce((a, b) => a + b, 0); if (!total) return 0;
    x.textAlign = 'right'; font(x, 3.8, 800); x.fillText(`המשפט הנסתר (${total} אותיות): באותיות שנשארו, לפי סדר הקריאה`, X + W - 2, Y + 3);
    let box = Math.min(6, (W - 4) / (total + groups.length)); let cx = X + W - 2, cy = Y + 8; x.lineWidth = .3;
    for (const g of groups) { for (let i = 0; i < g; i++) { x.strokeRect(cx - box, cy, box, box); cx -= box; } cx -= box * .8; }
    return 9 + box;
  }

  // מחזיר מערך עמודים לתפזורת אחת
  function puzzlePages(p, numStart) {
    const n = p.gen.n, sub = `${LV_NAME[p.level] || ''} · ${p.words.length} מילים · ${n}×${n}`;
    const pages = [];
    const hasHidden = normWord(p.hidden || '').length > 0;
    if (n <= 20) {
      const pg = page(210, 297); header(pg, p, sub);
      const hidH = hasHidden ? 18 : 0;
      const L = wordListLayout(p, 182, 297 - 38 - 8 - hidH - 16 - 125);
      const size = Math.min(182, 297 - 38 - 8 - L.h - hidH - 16);
      const gx = (210 - size) / 2; drawGrid(pg, p.gen.grid, n, gx, 38, size);
      let y = 38 + size + 7; drawWordList(pg, p, 14, y, 182, L); y += L.h + 5;
      if (hasHidden) hiddenLine(pg, p, 14, y, 182);
      footer(pg, numStart); pages.push(pg);
    } else if (n <= 30) {
      const pg = page(297, 210); header(pg, p, sub);
      const size = 210 - 38 - 14; const gx = 297 - 12 - size; drawGrid(pg, p.gen.grid, n, gx, 38, size);
      const W = gx - 8 - 12; const L = wordListLayout(p, W, 210 - 38 - 14 - (hasHidden ? 20 : 0)); drawWordList(pg, p, 12, 38, W, L);
      if (hasHidden) hiddenLine(pg, p, 12, 38 + L.h + 6, W);
      footer(pg, numStart); pages.push(pg);
    } else {
      const half = Math.ceil(n / 2);
      const pg1 = page(210, 297); header(pg1, p, sub + ' · חלק 1 מתוך 2');
      const size1 = Math.min(186, (297 - 40 - 22) * n / half); drawGrid(pg1, p.gen.grid, n, (210 - size1) / 2, 40, size1, 0, half);
      font(pg1.x, 3.4, 700); pg1.x.textAlign = 'center'; pg1.x.fillText('המשך התפזורת בעמוד הבא ⬇', 105, 297 - 16);
      footer(pg1, numStart); pages.push(pg1);
      const pg2 = page(210, 297); const hidH = hasHidden ? 18 : 0; const L = wordListLayout(p, 182, 297 - 20 - hidH - 22 - 110);
      const avail = 297 - 20 - L.h - hidH - 22; const size2 = Math.min(186, avail * n / (n - half));
      font(pg2.x, 3.4, 700); pg2.x.textAlign = 'center'; pg2.x.fillText(`${p.title || 'תפזורת'} — חלק 2 מתוך 2`, 105, 12);
      const h2 = drawGrid(pg2, p.gen.grid, n, (210 - size2) / 2, 18, size2, half, n);
      let y = 18 + h2 + 7; drawWordList(pg2, p, 14, y, 182, L); y += L.h + 5; if (hasHidden) hiddenLine(pg2, p, 14, y, 182);
      footer(pg2, numStart ? numStart + 1 : 0); pages.push(pg2);
    }
    return pages;
  }

  function coverPage(title, subtitle, count) {
    const pg = page(210, 297), { x } = pg;
    // רקע אותיות עדין
    font(x, 9, 700); x.fillStyle = '#e8e8e8'; x.textAlign = 'center'; const rnd = mulberry32(7);
    for (let r = 0; r < 26; r++) for (let c = 0; c < 18; c++) x.fillText(HEB_LETTERS[Math.floor(rnd() * 22)], 10 + c * 11, 12 + r * 11);
    x.fillStyle = '#fff'; rr(x, 22, 92, 166, 112, 8); x.fill(); x.lineWidth = 1.2; x.strokeStyle = '#000'; rr(x, 22, 92, 166, 112, 8); x.stroke(); x.lineWidth = .4; rr(x, 25, 95, 160, 106, 6); x.stroke();
    x.fillStyle = '#000'; fitText(x, title, 145, 16, 900); x.fillText(title, 105, 130);
    font(x, 6, 400); x.fillText(subtitle || 'חוברת תפזורות', 105, 152);
    font(x, 4.5, 700); x.fillText(`${count} תפזורות`, 105, 172);
    font(x, 3.5, 400); x.fillStyle = '#666'; x.fillText('נוצר באפליקציית תפזורת+', 105, 190);
    return pg;
  }

  async function build(pagesFn, fileName, onProgress) {
    await document.fonts.load('900 20px Heebo'); await document.fonts.load('700 20px Heebo'); await document.fonts.load('400 20px Heebo');
    const { jsPDF } = window.jspdf; let doc = null;
    const pages = await pagesFn();
    for (let i = 0; i < pages.length; i++) {
      const pg = pages[i];
      const data = pg.c.toDataURL('image/jpeg', .9);
      const fmt = pg.orient === 'l' ? [297, 210] : [210, 297];
      if (!doc) doc = new jsPDF({ orientation: pg.orient === 'l' ? 'landscape' : 'portrait', unit: 'mm', format: 'a4', compress: true });
      else doc.addPage('a4', pg.orient === 'l' ? 'landscape' : 'portrait');
      doc.addImage(data, 'JPEG', 0, 0, fmt[0], fmt[1], undefined, 'FAST');
      pg.c.width = pg.c.height = 0;
      onProgress && onProgress(i + 1, pages.length);
      await new Promise(r => setTimeout(r, 0));
    }
    doc.setProperties({ title: fileName.replace(/\.pdf$/, ''), creator: 'תפזורת+' });
    return doc.output('blob');
  }

  async function single(p) { return build(async () => puzzlePages(p, 0), `${p.title || 'תפזורת'}.pdf`); }
  async function booklet(bk, puzzles, onProgress) {
    return build(async () => {
      const pages = []; if (bk.cover) pages.push(coverPage(bk.title || 'חוברת תפזורות', bk.subtitle, puzzles.length));
      let num = 1; for (const p of puzzles) { const ps = puzzlePages(p, num); num += ps.length; pages.push(...ps); }
      return pages;
    }, `${bk.title}.pdf`, onProgress);
  }
  return { single, booklet };
})();

function deepMerge(a, b) { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) deepMerge(a[k], b[k]); else a[k] = b[k]; } return a; }
let saveT = 0; function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ האחסון במכשיר מלא'); } }, 150); }
addEventListener('pagehide', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } });

/* ---------- עזרים ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = s => { s = Math.round(s); const m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; };
const today = (d = new Date()) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms); }
function modal(html, opts = {}) { const m = $('#modal'); m.innerHTML = `<div class="mbox">${html}</div>`; m.classList.add('show'); m.onclick = e => { if (e.target === m && !opts.sticky) closeModal(); }; return $('.mbox', m); }
function closeModal() { $('#modal').classList.remove('show'); $('#modal').innerHTML = ''; }
function confirmBox(text, okText = 'אישור', danger = false) { return new Promise(res => { const b = modal(`<h2>${esc(text)}</h2><div class="row" style="margin-top:16px"><button class="btn ${danger ? 'danger' : 'primary'} grow" id="ok">${okText}</button><button class="btn grow" id="no">ביטול</button></div>`); $('#ok', b).onclick = () => { closeModal(); res(true); }; $('#no', b).onclick = () => { closeModal(); res(false); }; }); }
function rankOf(pts) { let i = 0; RANKS.forEach((r, k) => { if (pts >= r[1]) i = k; }); return i; }
function applyTheme() { const t = S.settings.theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : S.settings.theme; document.documentElement.dataset.theme = t; const m = $('meta[name=theme-color]'); if (m) m.content = t === 'light' ? '#f5f3ff' : '#0d0b1e'; }
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', applyTheme);

/* ---------- נתוני תפזורות מוכנות ---------- */
const CATS = window.BUILTIN || [];
const catById = id => CATS.find(c => c.id === id);
function builtinWords(pz) { return pz.words.filter(w => !(S.settings.kids && w.startsWith('*'))).map(w => { const d = w.replace(/^\*/, ''); return { display: d, norm: normWord(d) }; }); }
function catProgress(cat) { let done = 0; cat.puzzles.forEach((_, i) => { if (S.progress[`${cat.id}-${i}`]) done++; }); return done; }

/* ---------- ניווט ---------- */
const views = {};
let current = null;
function go(name, params = {}, replace = false) {
  const st = { name, params }; if (replace) history.replaceState(st, ''); else history.pushState(st, '');
  render(st);
}
addEventListener('popstate', e => render(e.state || { name: 'home', params: {} }));
function render(st) {
  if (current && current.leave) current.leave();
  closeModal();
  const v = views[st.name] || views.home; current = v;
  const main = $('#view'); main.classList.remove('view-enter'); void main.offsetWidth; main.classList.add('view-enter');
  $('#bartitle').textContent = v.title ? (typeof v.title === 'function' ? v.title(st.params) : v.title) : 'תפזורת+';
  $('#backbtn').style.visibility = st.name === 'home' ? 'hidden' : 'visible';
  main.innerHTML = ''; v.render(main, st.params || {});
  scrollTo(0, 0);
}

      });
    }
  }
};
function genFor(p, seed) { return generatePuzzle(p.words, { level: p.level, dirs: p.custom || undefined, hidden: p.hidden, seed }); }

    $('#ed', el).onclick = () => go('create', { edit: p.id });
    $('#bk', el).onclick = () => addToBooklet({ type: 'u', id: p.id });
  }
};
function staticGrid(container, gen, box, animate) {
  const n = gen.n, cs = Math.floor(box / n), g = document.createElement('div');
  g.className = 'grid' + (animate && S.settings.fx ? ' drop' : ''); g.style.cssText = `grid-template-columns:repeat(${n},${cs}px);grid-auto-rows:${cs}px;width:${cs * n}px;margin:0 auto;font-size:${cs * .58}px`;
  const total = n * n, step = Math.min(18, 900 / total);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) { const d = document.createElement('div'); d.className = 'cell'; d.textContent = gen.grid[r][c]; if (animate) d.style.animationDelay = ((r + c) * step * 2.2) + 'ms'; g.appendChild(d); }
  container.appendChild(g);
}

/* ---------- ניקוד, דרגות והישגים ---------- */
function reward(p, hadSecret) {

  const target = wc * ({ easy: 15, medium: 20, hard: 26 }[p.level]);
  const speed = p.elapsed < target ? Math.round(base * .5 * (1 - p.elapsed / target)) : 0;
  const pen = Math.round(base * Math.min(.6, p.hints * .1));
  const pts = Math.max(5, Math.round(base + speed - pen));
  const before = rankOf(S.points); S.points += pts; const after = rankOf(S.points);
  const st = S.stats; st.solved++; st.time += p.elapsed; st.words += wc; st.lv[p.level][0]++; st.lv[p.level][1] += p.elapsed;
  if (p.cat) st.cats[p.cat] = (st.cats[p.cat] || 0) + 1;
  if (hadSecret) st.secrets++; if (p.hideList) st.hid++; if (!p.hints) st.noh++; if (p.level === 'hard') st.hard++;
  // שמירת שיא
  const pk = p.src === 'b' ? p.ref : p.src === 'u' ? 'u:' + p.ref : null;
  if (pk) { const pr = S.progress[pk] = S.progress[pk] || {}; const slot = p.src === 'b' ? p.level : 'best'; const cur = pr[slot] || (pr[slot] = { best: 0, n: 0 }); cur.n++; if (!cur.best || p.elapsed < cur.best) cur.best = Math.round(p.elapsed); if (p.src === 'u') S.progress[pk] = cur; }

  const t = today(), y = today(new Date(Date.now() - 864e5));
  if (S.streak.last !== t) { S.streak.cur = S.streak.last === y ? S.streak.cur + 1 : 1; S.streak.last = t; S.streak.best = Math.max(S.streak.best, S.streak.cur); }
  delete S.inprog[p.key];
  const ctx = { p, hadSecret };
  const newAch = checkAch(ctx); save();
  Sound.win(); FX.confetti(); FX.fireworks(5);
  const b = modal(`<div class="bigwin"><div class="trophy">🏆</div><h2>כל הכבוד!</h2>
    <p class="muted">מצאת את כל ${wc} המילים ב-${fmtTime(p.elapsed)}${p.hints ? ` · ${p.hints} רמזים` : ' · בלי רמזים!'}</p>
    <div class="pts">+${pts}</div><div class="muted" style="font-size:.85rem">בסיס ${Math.round(base)}${speed ? ` · בונוס מהירות +${speed}` : ''}${pen ? ` · רמזים −${pen}` : ''}</div>
    ${hadSecret ? `<div class="achpop">🤫 <div>המשפט הנסתר: <b>${esc(p.hidden)}</b></div></div>` : ''}
    ${newAch.map(a => `<div class="achpop"><span style="font-size:1.6rem">${a[1]}</span><div><b>הישג חדש: ${a[2]}</b><br><small>${a[3]}</small></div></div>`).join('')}
    <div class="row" style="margin-top:16px"><button class="btn primary grow" id="again">${p.src === 'b' ? '➡️ הבאה' : '🔄 שוב'}</button><button class="btn grow" id="home">🏠 בית</button></div></div>`, { sticky: true });
  $('#home', b).onclick = () => { closeModal(); go('home'); };
  $('#again', b).onclick = () => { closeModal();
    if (p.src === 'b') { const c = catById(p.cat), i = +p.ref.split('-').pop(); if (i + 1 < c.puzzles.length) startBuiltin(c, i + 1, p.level, p.hideList); else go('cat', { id: c.id }); }
    else if (p.src === 'u') { const up = S.my.find(x => x.id === p.ref); if (up) { up.gen = genFor(up); save(); startUser(up); } else go('home'); }
    else go('home'); };
  if (after > before) setTimeout(() => rankUp(after), 2600);
}
function rankUp(i) {

  const b = modal(`<div class="rankup"><div class="big">${r[2]}</div><div class="muted">עלית דרגה!</div><h2>${r[0]}</h2><p class="muted">דרגה ${i + 1} מתוך ${RANKS.length}</p><button class="btn primary block" id="ok">יש! 🎉</button></div>`);

function checkAch(ctx) {
  const st = S.stats, got = [], has = id => S.ach[id];
  const give = id => { if (!has(id)) { S.ach[id] = Date.now(); got.push(ACH.find(a => a[0] === id)); } };
  if (st.solved >= 1) give('first'); if (st.solved >= 10) give('s10'); if (st.solved >= 25) give('s25'); if (st.solved >= 50) give('s50'); if (st.solved >= 100) give('s100'); if (st.solved >= 250) give('s250');
  if (st.words >= 100) give('w100'); if (st.words >= 500) give('w500'); if (st.words >= 2000) give('w2000');
  if (st.noh >= 10) give('noh10'); if (st.hard >= 10) give('hard10'); if (st.hid >= 5) give('hid5'); if (st.secrets >= 1) give('sec1'); if (st.secrets >= 10) give('sec10');
  if (st.created >= 1) give('cr1'); if (st.created >= 10) give('cr10'); if (st.shared >= 1) give('share'); if (st.pdfs >= 1) give('pdf'); if (st.books >= 1) give('book');
  if (S.streak.cur >= 3) give('st3'); if (S.streak.cur >= 7) give('st7'); if (S.streak.cur >= 30) give('st30');
  const done = CATS.filter(c => catProgress(c) === c.puzzles.length).length; if (done >= 1) give('cat1'); if (done >= 5) give('cat5');
  if (Object.keys(st.cats).length >= 10) give('exp10');
  const ri = rankOf(S.points); if (ri >= 9) give('r10'); if (ri >= 19) give('r20');
  if (ctx && ctx.p) { const p = ctx.p, wc = p.words.length;
    if (wc >= 10 && p.elapsed < 60) give('fast60'); if (wc >= 12 && p.elapsed < 40) give('fast40');
    if (p.level === 'hard' && !p.hints) give('nohard'); if (p.level === 'hard' && p.hideList) give('hidhard');
    const h = new Date().getHours(); if (h < 5) give('night'); if (wc >= 25) give('big'); }
  if (got.length && !ctx) got.forEach((a, k) => setTimeout(() => toast(`${a[1]} הישג חדש: ${a[2]}`), k * 2800));
  return got;
}

/* ---------- שיתוף ---------- */
function shareUrl(p) { return SITE + '#p=' + encodePuzzle(p); }
async function sharePuzzle(p) {
  const url = shareUrl(p), text = `🧩 נסה לפתור את התפזורת "${p.title}"!\n${url}`;
  S.stats.shared++; save(); checkAch();
  const b = modal(`<h2>📤 שיתוף "${esc(p.title)}"</h2><p class="muted">מי שיפתח את הקישור יוכל לפתור ישר בטלפון, להדפיס ולשמור אצלו.</p>
    <div class="list"><a class="btn primary block" id="wa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">💬 שלח בווצאפ</a>
    ${navigator.share ? '<button class="btn block" id="ns">📲 שיתוף אחר</button>' : ''}<button class="btn block" id="cp">📋 העתק קישור</button></div>`);
  if ($('#ns', b)) $('#ns', b).onclick = () => navigator.share({ title: p.title, text }).catch(() => { });
  $('#cp', b).onclick = async () => { try { await navigator.clipboard.writeText(url); toast('הקישור הועתק 📋'); } catch (e) { const t = document.createElement('textarea'); t.className = 'in'; t.value = url; t.style.marginTop = '10px'; b.appendChild(t); t.select(); toast('סמן והעתק את הקישור מהתיבה'); } };
}

/* ---------- PDF ---------- */
async function deliverPdf(blob, name) {
  S.stats.pdfs++; save(); checkAch();
  if (window.AndroidBridge && AndroidBridge.saveFile) { const r = new FileReader(); r.onload = () => AndroidBridge.saveFile(name, r.result.split(',')[1], 'application/pdf'); r.readAsDataURL(blob); return; }
  const file = new File([blob], name, { type: 'application/pdf' }), url = URL.createObjectURL(blob);
  const b = modal(`<h2>📄 הקובץ מוכן!</h2><p class="muted">${esc(name)} · ${(blob.size / 1024 / 1024).toFixed(1)}MB</p><div class="list"><a class="btn primary block" href="${url}" download="${esc(name)}" id="dl">⬇️ הורד PDF</a>
    ${navigator.canShare && navigator.canShare({ files: [file] }) ? '<button class="btn block" id="sh">📲 שתף / שלח להדפסה</button>' : ''}<a class="btn block" href="${url}" target="_blank" rel="noopener">👁️ פתח לצפייה</a></div>`);
  if ($('#sh', b)) $('#sh', b).onclick = () => navigator.share({ files: [file], title: name }).catch(() => { });
}
async function makePdf(p) {
  modal(`<div style="text-align:center"><div style="font-size:3rem;animation:trophy 1s infinite alternate">🖨️</div><h2>מכין PDF...</h2></div>`, { sticky: true });
  try { const blob = await PDF.single(p); closeModal(); deliverPdf(blob, `${(p.title || 'תפזורת').replace(/[\\/:*?"<>|]/g, '')}.pdf`); }
  catch (e) { closeModal(); toast('שגיאה ביצירת PDF: ' + e.message); console.error(e); }
}

function resolveItem(it) {
  if (it.type === 'u') { const p = S.my.find(x => x.id === it.id); return p ? { ...p } : null; }
  const [cid, idx] = [it.id.slice(0, it.id.lastIndexOf('-')), +it.id.slice(it.id.lastIndexOf('-') + 1)]; const c = catById(cid); if (!c || !c.puzzles[idx]) return null;
  const pz = c.puzzles[idx], p = { title: pz.title, words: builtinWords(pz), level: it.level, hidden: pz.hidden || '', hideList: it.hide || !!c.hideList };
  p.gen = genFor(p, it.seed); return p;
}

/* ---------- אתחול ---------- */
function boot() {
  load(); applyTheme(); FX.init();
  $('#backbtn').onclick = () => { Sound.click(); history.length > 1 && history.state && history.state.name !== 'home' ? history.back() : go('home', {}, true); };
  $('#homebtn').onclick = () => { Sound.click(); go('home'); };
  const m = location.hash.match(/#p=([\w-]+)/);
  history.replaceState({ name: 'home', params: {} }, '', location.pathname + location.search);
  if (m) { history.pushState({ name: 'home', params: {} }, ''); startShared(m[1]); }
  else render({ name: 'home', params: {} });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
}
addEventListener('DOMContentLoaded', boot);
